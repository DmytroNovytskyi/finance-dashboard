spring:
  application:
    name: finance-dashboard
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  api-docs:
    path: /v1/api-docs

finance:
  base-currency: ${FINANCE_BASE_CURRENCY:PLN}
  currencies: ${FINANCE_CURRENCIES:PLN,USD}
  fx:
    nbp:
      base-url: ${NBP_BASE_URL:https://api.nbp.pl}
    import:
      lookback-days: ${FX_IMPORT_LOOKBACK_DAYS:5}
    backfill-on-startup: ${FX_BACKFILL_ON_STARTUP:false}
