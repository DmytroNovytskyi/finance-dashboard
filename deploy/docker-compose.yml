# Template. Copy to the deploy host OUTSIDE the repo (sibling of data/), then fill .env.
# Build contexts are relative to this file's location:
#   ./app/... = the cloned repository, ./data = the external DB data directory.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finance
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      FINANCE_BASE_CURRENCY: ${FINANCE_BASE_CURRENCY:-PLN}
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      db:
        condition: service_healthy
    # no published port — internal only

  frontend:
    build: ./app/frontend
    ports:
      - "${FRONTEND_PORT:-8100}:80"
    depends_on:
      - backend
